services:
  firewall:
    build: ./firewall
    container_name: firewall
    cap_add:
      - NET_ADMIN
      - SYSLOG
    sysctls:
      net.ipv4.ip_forward: 1
    ports:
      - "8080:5000"
    networks:
      attacker_net:
        ipv4_address: 10.10.1.254
      dmz_net:
        ipv4_address: 10.10.2.254
      internal_net:
        ipv4_address: 10.10.3.254

  scanner:
    image: alpine:latest
    container_name: scanner
    command: >
      sh -c "
      apk add --no-cache nmap curl &&
      while true; do
        echo '\n\n=== SCAN firewall ===';
        nmap -Pn 10.10.1.254;
        echo '\n--- run curl ---';
        curl -s http://10.10.1.254:5000;

        sleep 10;
      done
      "
    networks:
      attacker_net:
        ipv4_address: 10.10.1.10

  web:
    build: ./web
    container_name: web
    networks:
      dmz_net:
        ipv4_address: 10.10.2.10

  internal:
    image: hashicorp/http-echo
    command:
      - "-text=SECRET_INTERNAL_DATA"
    networks:
      internal_net:
        ipv4_address: 10.10.3.10

networks:
  attacker_net:
    ipam:
      config:
        - subnet: 10.10.1.0/24
  dmz_net:
    ipam:
      config:
        - subnet: 10.10.2.0/24
  internal_net:
    ipam:
      config:
        - subnet: 10.10.3.0/24
